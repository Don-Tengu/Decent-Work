# Shared configuration. Environment overlays:
#   application-local.yml  (profile local, default) — Anvil
#   application-dev.yml    (profile dev)            — Base Sepolia
#   application-prod.yml   (profile prod)           — Base
spring:
  application:
    name: decent-work
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/decent_work}
    username: ${DATABASE_USERNAME:}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 110MB

  graphql:
    graphiql:
      enabled: false
      path: /graphiql
    path: /graphql
    schema:
      printer:
        enabled: false
    cors:
      allowed-origins: "*"
      allowed-methods: "*"

server:
  port: ${SERVER_PORT:8080}

# Web3 binding — one chain per process.
# Environment (local|dev|prod) picks the chain; payment token is separate.
# Add USDT later as extra token-* keys or a tokens map; do not add new Spring profiles for coins.
web3:
  family: ${WEB3_FAMILY:evm}
  chain-key: ${WEB3_CHAIN_KEY:anvil}
  provider-url: ${WEB3_PROVIDER_URL:http://127.0.0.1:8545}
  escrow-contract-address: ${ESCROW_CONTRACT_ADDRESS:0x0000000000000000000000000000000000000000}
  chain-id: ${WEB3_CHAIN_ID:31337}
  token-address: ${WEB3_TOKEN_ADDRESS:}
  token-symbol: ${WEB3_TOKEN_SYMBOL:USDC}
  token-decimals: ${WEB3_TOKEN_DECIMALS:6}
  platform-fee-percent: ${PLATFORM_FEE_PERCENT:5}

app:
  uploads:
    job-attachments-dir: ${JOB_ATTACHMENTS_DIR:uploads/job-attachments}
    bid-attachments-dir: ${BID_ATTACHMENTS_DIR:uploads/bid-attachments}

jwt:
  secret: ${JWT_SECRET:}
  expiration: ${JWT_EXPIRATION:86400000}

logging:
  level:
    root: info
